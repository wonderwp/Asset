name: CI

on: [ push ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - uses: php-actions/composer@v5

      - name: PHPUnit Tests
        uses: php-actions/phpunit@v3
        with:
          version: 9.6.33
          php_version: "8.1"
          configuration: phpunit.xml.dist
          phpunit_path: vendor/bin/phpunit
